<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp System</title>
</head>

<body>
  <main>
    <!------------SignUp------------------>
     <div class="Signup-wrapper">
         <h2 align="center">Sign-Up Portal</h2>

           <form class="SignupForm" action="#" method="POST">
              <!------------Username------------>
               <div class="formGroup">
                  <label for="Username">Username</label>
                  <input type="text" id="Username" name="Username">
                  <span class="error-message" id="UsernameError"></span>
               </div><br>

              <!---------Email----------------->
                <div class="formGroup">
                   <label for="Email">Email</label>
                   <input type="Email" id="Email" name="Email">
                   <span class="error-message" id="emailError"></span>
                </div><br>

              <!----------Password------------->
                <div class="formGroup">
                   <label for="Password">Password</label>
                   <input type="Password" id="Password" name="Password">
                   <span class="error-message" id="PasswordError"></span>
               </div><br>
               
              <!----------Checkbox-------------->
                <div class="formGroup">
                    <label for="checkbox">I agree to terms</label>
                    <input type="checkbox" id="checkbox" name="checkbox">
                    <span class="error-message" id="termsError"></span>
                </div><br>

              <!---------Resend verification button-->
               <div class="formGroup">
                 <button type="Button" id="ResendButton" disabled>Resend Vertification (10s)</button>
               </div><br>

              <!----------Submit---------------->
                <button type="Submit">Submit</button>
           </form>
     </div>
  </main>
    <!---------Client-side Validation-------->
      <script src="Client-Side Validation.js"></script>
</body>
</html>
